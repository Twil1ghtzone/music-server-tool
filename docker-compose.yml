# ---------------------------------------------------------------------------
# music-server-tool -- kompletter Stack
#   navidrome        Streaming-Server (Quelle der Wahrheit fuer die Library)
#   deemix           Download-Engine
#   gateway-api      Subsonic-Proxy + Web-Dashboard   <- Clients verbinden hier
#   gateway-worker   Downloads, Import, Scan, Dedup
# ---------------------------------------------------------------------------
name: music-server-tool

x-common: &common
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-gateway-env: &gateway-env
  TZ: ${TZ:-Europe/Berlin}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  NAVIDROME_URL: ${NAVIDROME_URL:-http://navidrome:4533}
  NAVIDROME_USER: ${NAVIDROME_USER:-admin}
  NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD}
  DEEMIX_URL: ${DEEMIX_URL:-http://deemix:6595}
  DEEMIX_BITRATE: ${DEEMIX_BITRATE:-3}
  MUSIC_DIR: /music
  STAGING_DIR: /staging
  QUARANTINE_DIR: /quarantine
  DB_PATH: /data/gateway.db
  CACHE_DIR: /data/cache
  GATEWAY_ADMIN_USER: ${GATEWAY_ADMIN_USER:-admin}
  GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD}
  GATEWAY_SESSION_SECRET: ${GATEWAY_SESSION_SECRET}
  GATEWAY_SECURE_COOKIES: ${GATEWAY_SECURE_COOKIES:-false}
  GATEWAY_STREAM_MODE: ${GATEWAY_STREAM_MODE:-defer}
  GATEWAY_MARKER_SUFFIX: ${GATEWAY_MARKER_SUFFIX:- [Nicht heruntergeladen]}
  GATEWAY_WORKER_CONCURRENCY: ${GATEWAY_WORKER_CONCURRENCY:-2}

services:
  # -------------------------------------------------------------------------
  navidrome:
    <<: *common
    image: deluan/navidrome:latest
    container_name: navidrome
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${NAVIDROME_PORT:-4533}:4533"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      ND_SCANSCHEDULE: 24h          # Watcher uebernimmt, Full-Scan nur als Netz
      ND_MONITORCHANGES: "true"     # Live-Watcher: neue Dateien sofort sichtbar
      ND_LOGLEVEL: ${LOG_LEVEL:-info}
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ""
      ND_LYRICSPRIORITY: .lrc,embedded,.txt
      ND_ENABLETRANSCODINGCONFIG: "false"
    volumes:
      - ./data/navidrome:/data
      - ${MUSIC_DIR:-/mnt/tank/music}:/music:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4533/ping"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  # -------------------------------------------------------------------------
  deemix:
    <<: *common
    image: ghcr.io/bambanah/deemix:latest
    container_name: deemix
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Berlin}
      DEEMIX_SERVER_PORT: 6595
      DEEMIX_SERVER_HOST: 0.0.0.0
      DEEMIX_SINGLE_USER: "true"
      ARL: ${DEEZER_ARL}
    volumes:
      - ./config/deemix:/config
      # Deemix laedt in die Staging-Ablage, NICHT direkt in die Library.
      - ${STAGING_DIR:-/mnt/tank/music-staging}:/downloads
    ports:
      # Nur zur Fehlersuche noetig. Im Normalbetrieb auskommentieren:
      # der Gateway erreicht Deemix ueber das interne Netz.
      - "${DEEMIX_PORT:-6595}:6595"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6595/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend]

  # -------------------------------------------------------------------------
  gateway-api:
    <<: *common
    build:
      context: ./gateway
    image: music-gateway:local
    container_name: music-gateway-api
    command: ["api"]
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      <<: *gateway-env
      GATEWAY_ROLE: api
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./data/gateway:/data
      - ${MUSIC_DIR:-/mnt/tank/music}:/music
      - ${STAGING_DIR:-/mnt/tank/music-staging}:/staging
      - ${QUARANTINE_DIR:-/mnt/tank/music-quarantine}:/quarantine
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      navidrome:
        condition: service_healthy
    networks: [backend]

  # -------------------------------------------------------------------------
  gateway-worker:
    <<: *common
    build:
      context: ./gateway
    image: music-gateway:local
    container_name: music-gateway-worker
    command: ["worker"]
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      <<: *gateway-env
      GATEWAY_ROLE: worker
    volumes:
      - ./data/gateway:/data
      - ${MUSIC_DIR:-/mnt/tank/music}:/music
      - ${STAGING_DIR:-/mnt/tank/music-staging}:/staging
      - ${QUARANTINE_DIR:-/mnt/tank/music-quarantine}:/quarantine
    tmpfs: ["/tmp"]
    depends_on:
      gateway-api:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
    driver: bridge
