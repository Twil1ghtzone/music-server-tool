<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <!-- Muss zum Seitengrund passen, sonst blitzt auf Mobilgeräten die
       Browserleiste in einer anderen Farbe auf. -->
  <meta name="theme-color" content="#0b1220">
  <title>music-server-tool</title>

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">

  <!-- SVG statt Emoji: wird überall gleich gezeichnet und lässt sich färben. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234c8dff' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M9 18V5l12-2v13'/%3E%3Ccircle cx='6' cy='18' r='3'/%3E%3Ccircle cx='18' cy='16' r='3'/%3E%3C/svg%3E">
</head>
<body>

<a class="skip" href="#view">Zum Inhalt springen</a>

<!-- ============================================================= Anmeldung -->
<div id="login" class="login-shell" hidden>
  <form id="login-form" class="card login-card">
    <h1 translate="no">music-server-tool</h1>
    <p class="sub">Gateway zwischen Navidrome und Deemix</p>

    <label for="login-user">Benutzer
      <input id="login-user" name="username" autocomplete="username"
             spellcheck="false" required autofocus>
    </label>
    <label for="login-pass">Passwort
      <input id="login-pass" name="password" type="password"
             autocomplete="current-password" required>
    </label>
    <label id="totp-field" for="login-totp" hidden>Code der Authenticator-App
      <input id="login-totp" name="totp" inputmode="numeric"
             autocomplete="one-time-code" spellcheck="false" maxlength="10">
    </label>

    <button type="submit" class="btn btn-primary btn-lg" id="login-submit">Anmelden</button>
    <p id="login-error" class="error small" role="alert" hidden></p>
  </form>
</div>

<!-- =================================================================== App -->
<div id="app" class="shell" hidden>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-name" translate="no">music-server-tool</div>
        <div class="brand-user" id="brand-user">verbinde&hellip;</div>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="Hauptnavigation"></nav>

    <div class="sidebar-foot">
      <span class="pill" id="sse-state" title="Verbindung zum Ereignisstrom">offline</span>
      <button type="button" class="btn btn-sm btn-ghost" id="logout">Abmelden</button>
    </div>
  </aside>

  <!-- Jedes Modul zeichnet ausschließlich hier hinein. -->
  <main class="content" id="view" tabindex="-1"></main>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
