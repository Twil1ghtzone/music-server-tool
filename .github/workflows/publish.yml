# Baut das Gateway-Image und legt es in der GitHub Container Registry ab.
#
# Damit braucht der Server keinen Quellcode und keinen Build-Schritt mehr:
# die Compose zieht ghcr.io/twil1ghtzone/music-server-tool:latest.
name: Image veroeffentlichen

on:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ./gateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache ueber Laeufe hinweg: ffmpeg und die Python-Abhaengigkeiten
          # muessen nicht bei jedem Commit neu installiert werden.
          cache-from: type=gha
          cache-to: type=gha,mode=max
